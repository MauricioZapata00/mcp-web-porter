[package]
name = "mcp-web-porter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmcp = { version = "0.14.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.1"

scraper = "0.25.0"
select = "0.6.1"
html5ever = "0.38.0"

image = "0.25.9"
base64 = "0.22.1"

[dev-dependencies]
tokio-test = "0.4.5"
