[package]
name = "mcp-web-porter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmcp = { version = "0.16.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.1"

scraper = "0.25.0"
select = "0.6.1"
html5ever = "0.38.0"

chromiumoxide = { version = "0.7.0", features = ["tokio-runtime"] }
futures = "0.3.32"

image = "0.25.9"
base64 = "0.22.1"

chrono = "0.4"
url = "2.5"

# Cookie extraction
rusqlite = { version = "0.40", features = ["bundled"] }

# Crypto (RustCrypto)
aes    = "0.9"
cbc    = { version = "0.2", features = ["alloc"] }
cipher = "0.5"
pbkdf2 = { version = "0.13", features = ["hmac"] }
hmac   = "0.13"
sha1   = "0.11"

# OS-specific
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }

[dev-dependencies]
tokio-test = "0.4.5"
serial_test = "3.4.0"
mockall = "0.14.0"
