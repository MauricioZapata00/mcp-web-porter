[package]
name = "mcp-web-porter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmcp = { version = "0.14.0", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

scraper = "0.20"
select = "0.6"
html5ever = "0.27"

image = "0.25"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
